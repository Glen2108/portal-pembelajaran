<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informatika - SMA Negeri 4 Manado</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
          colors: {
            sky: {
              50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#0369a1', 800: '#075985', 900: '#0c4a6e',
            },
            gold: {
              300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .bg-sky-gradient { background: linear-gradient(135deg, #0c4a6e 0%, #0284c7 50%, #0369a1 100%); }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(234, 179, 8, 0.2); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #ca8a04; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header & Navigasi -->
  <header class="sticky top-0 z-40 glass-card border-b border-gold-500/30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      
      <div class="flex items-center space-x-3">
        <div class="flex items-center space-x-2 sm:space-x-3 cursor-pointer" onclick="switchPage('home')">
          <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gold-500 flex items-center justify-center text-slate-900 font-bold text-lg sm:text-xl shadow-lg">
            <i class="fa-solid fa-laptop-code"></i>
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-bold text-white leading-tight">INFORMATIKA</h1>
            <p class="text-[10px] sm:text-xs text-gold-400 font-medium">SMA Negeri 4 Manado</p>
          </div>
        </div>

        <button onclick="toggleMobileMenu()" class="md:hidden ml-2 bg-gradient-to-r from-gold-500 to-gold-400 text-slate-950 font-bold py-1.5 px-3 rounded-lg shadow-md flex items-center space-x-1">
          <i class="fa-solid fa-bars text-xs"></i>
          <span class="text-xs font-semibold">Menu</span>
        </button>
      </div>

      <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
        <button onclick="switchPage('home')" id="nav-home" class="nav-btn text-gold-400 hover:text-gold-300 transition"><i class="fa-solid fa-house mr-1"></i> Beranda</button>
        <button onclick="switchPage('materi')" id="nav-materi" class="nav-btn text-slate-300 hover:text-gold-400 transition"><i class="fa-solid fa-book-open mr-1"></i> Materi</button>
        <button onclick="switchPage('tugas')" id="nav-tugas" class="nav-btn text-slate-300 hover:text-gold-400 transition"><i class="fa-solid fa-tasks mr-1"></i> Tugas</button>
        <button onclick="switchPage('admin')" id="nav-admin" class="nav-btn text-slate-300 hover:text-gold-400 transition"><i class="fa-solid fa-user-shield mr-1"></i> Admin Guru</button>
      </nav>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <div id="user-badge" class="hidden md:flex items-center bg-sky-900/80 px-3 py-1.5 rounded-full border border-gold-500/40 text-xs">
          <span id="user-icon" class="text-gold-400 mr-2"><i class="fa-solid fa-user-graduate"></i></span>
          <span id="user-display-name" class="font-semibold text-white"></span>
          <span id="user-display-class" class="ml-1 text-gold-300 font-normal"></span>
        </div>
        <button onclick="logout()" class="bg-red-600/80 hover:bg-red-600 text-white text-xs px-2.5 sm:px-3 py-1.5 rounded-lg border border-red-400 transition flex items-center">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> <span class="hidden sm:inline">Keluar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Container Utama -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    <!-- HALAMAN BERANDA -->
    <section id="page-home" class="space-y-6">
      <div class="bg-sky-gradient p-6 rounded-2xl border border-gold-500/50 shadow-2xl relative overflow-hidden">
        <div class="relative z-10">
          <span class="bg-gold-500/20 text-gold-300 border border-gold-400/40 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
            Sistem Pembelajaran Digital
          </span>
          <h2 class="text-2xl md:text-3xl font-extrabold text-white mt-3">
            Selamat Datang Siswa-Siswi Kelas Terbaik!
          </h2>
          <p class="text-sky-100 text-sm md:text-base mt-2 max-w-2xl">
            Diampu oleh Guru Mata Pelajaran Informatika: <span class="text-gold-300 font-semibold">Glendy A. Taawoeda, S.Pd.</span>
          </p>
        </div>
      </div>
    </section>

    <!-- DASHBOARD ADMIN -->
    <section id="page-admin" class="space-y-6 hidden">
      <div class="glass-card p-6 rounded-2xl border border-gold-500/40">
        <h2 class="text-2xl font-bold text-white mb-4">Dashboard Guru</h2>
        <div id="admin-tab-siswa" class="space-y-4">
          <div class="overflow-x-auto rounded-xl border border-slate-700">
            <table class="w-full text-xs text-left text-slate-300">
              <thead class="bg-slate-900 text-gold-400 uppercase">
                <tr>
                  <th class="px-4 py-3">ID</th>
                  <th class="px-4 py-3">Nama Siswa</th>
                  <th class="px-4 py-3">Kelas</th>
                  <th class="px-4 py-3 text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="admin-siswa-tbody" class="divide-y divide-slate-800"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL LOGIN -->
  <div id="modal-login" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md px-4">
    <div class="glass-card max-w-md w-full p-6 rounded-2xl border-2 border-gold-500/60 shadow-2xl relative">
      <div class="text-center mb-6">
        <h3 class="text-xl font-bold text-white">Informatika SMAN 4 Manado</h3>
      </div>

      <div class="flex border-b border-slate-700 mb-5">
        <button onclick="switchLoginRole('siswa')" id="tab-login-siswa" class="w-1/2 py-2 text-xs font-bold border-b-2 border-gold-500 text-gold-400">Masuk Siswa</button>
        <button onclick="switchLoginRole('guru')" id="tab-login-guru" class="w-1/2 py-2 text-xs font-bold border-b-2 border-transparent text-slate-400">Masuk Guru</button>
      </div>

      <form id="form-login-siswa" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-300 mb-1">Pilih Kelas Terlebih Dahulu</label>
          <select id="login-kelas-siswa" required class="w-full bg-slate-800 text-gold-300 text-xs border border-slate-600 rounded-lg p-2.5 focus:border-gold-400 focus:outline-none">
            <option value="">-- Pilih Kelas Anda --</option>
            <option value="X-1">X-1</option><option value="X-2">X-2</option><option value="X-3">X-3</option><option value="X-4">X-4</option>
            <option value="XI-1">XI-1</option><option value="XI-2">XI-2</option><option value="XI-3">XI-3</option><option value="XI-4">XI-4</option><option value="XI-5">XI-5</option>
            <option value="XII-1">XII-1</option><option value="XII-2">XII-2</option><option value="XII-3">XII-3</option><option value="XII-4">XII-4</option><option value="XII-5">XII-5</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">Nama Lengkap Siswa</label>
          <input type="text" id="login-nama-siswa" placeholder="Masukkan nama Anda..." required class="w-full bg-slate-800 text-white text-xs border border-slate-600 rounded-lg p-2.5 focus:border-gold-400 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-gold-500 hover:bg-gold-400 text-slate-900 font-bold text-xs py-3 rounded-lg transition">Masuk</button>
      </form>

      <form id="form-login-guru" class="space-y-4 hidden">
        <div>
          <label class="block text-xs text-slate-300 mb-1">Kata Sandi Guru (Admin)</label>
          <input type="password" id="login-pass-guru" placeholder="Masukkan password admin..." required class="w-full bg-slate-800 text-white text-xs border border-slate-600 rounded-lg p-2.5 focus:border-gold-400 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs py-3 rounded-lg transition">Masuk Dashboard</button>
      </form>
    </div>
  </div>

  <!-- SCRIPT FIREBASE & UTAMA (Menggunakan JS Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyAtX4h3EZwtDOxZ8eSuExpXxQzrUtr0hpg",
      authDomain: "sman4-informatika.firebaseapp.com",
      databaseURL: "https://sman4-informatika-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sman4-informatika",
      storageBucket: "sman4-informatika.firebasestorage.app",
      messagingSenderId: "776201297912",
      appId: "1:776201297912:web:6e2d4f4abc03840356c00d",
      measurementId: "G-569B9NS24E"
    };

    // Inisialisasi Firebase & Realtime Database
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    let currentUser = null;

    // Fungsi global agar bisa dipanggil lewat onclick HTML
    window.switchPage = function(pageId) {
      ['home', 'admin'].forEach(p => {
        const el = document.getElementById('page-' + p);
        if (el) el.classList.add('hidden');
      });
      const target = document.getElementById('page-' + pageId);
      if(target) target.classList.remove('hidden');
    }

    window.switchLoginRole = function(role) {
      if (role === 'siswa') {
        document.getElementById('form-login-siswa').classList.remove('hidden');
        document.getElementById('form-login-guru').classList.add('hidden');
      } else {
        document.getElementById('form-login-guru').classList.remove('hidden');
        document.getElementById('form-login-siswa').classList.add('hidden');
      }
    }

    window.logout = function() {
      localStorage.removeItem('app_user_session');
      currentUser = null;
      document.getElementById('modal-login').classList.remove('hidden');
      document.getElementById('user-badge').classList.add('hidden');
    }

    function checkSession() {
      const savedUser = localStorage.getItem('app_user_session');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('modal-login').classList.add('hidden');
        updateUserUI();
      }
    }

    function updateUserUI() {
      if (!currentUser) return;
      document.getElementById('user-badge').classList.remove('hidden');
      document.getElementById('user-display-name').innerText = currentUser.name;
      document.getElementById('user-display-class').innerText = `(${currentUser.class})`;
    }

    // Handle Login Siswa dengan Firebase Realtime Database
    document.getElementById('form-login-siswa').addEventListener('submit', async (e) => {
      e.preventDefault();
      const namaInput = document.getElementById('login-nama-siswa').value.trim();
      const kelasInput = document.getElementById('login-kelas-siswa').value;

      try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, `siswa`));
        
        if (snapshot.exists()) {
          const dataSiswa = snapshot.val();
          const siswaValid = Object.values(dataSiswa).find(s => 
            s.nama.toLowerCase() === namaInput.toLowerCase() && s.kelas === kelasInput
          );

          if (siswaValid) {
            currentUser = { role: 'siswa', name: siswaValid.nama, class: siswaValid.kelas };
            localStorage.setItem('app_user_session', JSON.stringify(currentUser));
            document.getElementById('modal-login').classList.add('hidden');
            updateUserUI();
          } else {
            alert("Siswa tidak ditemukan di Firebase Database!");
          }
        } else {
          alert("Data siswa belum tersedia di database.");
        }
      } catch (error) {
        console.error("Error Firebase:", error);
        alert("Gagal terhubung ke Firebase: " + error.message);
      }
    });

    // Handle Login Guru
    document.getElementById('form-login-guru').addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('login-pass-guru').value;
      if (pass === 'glendy2108') {
        currentUser = { role: 'guru', name: 'Glendy A. Taawoeda, S.Pd.', class: 'Guru' };
        localStorage.setItem('app_user_session', JSON.stringify(currentUser));
        document.getElementById('modal-login').classList.add('hidden');
        updateUserUI();
        window.switchPage('admin');
      } else {
        alert("Kata sandi salah!");
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      checkSession();
    });
  </script>
</body>
</html>
